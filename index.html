<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Buku Catatan Jaga Kopontren — Gus Lim</title>
  <meta name="theme-color" content="#064E3B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kopontren">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%23064E3B'/%3E%3Cpath d='M96 28 C80 50, 72 65, 72 78 C72 90, 82 98, 96 98 C110 98, 120 90, 120 78 C120 65, 112 50, 96 28 Z' fill='%23F59E0B'/%3E%3Crect x='54' y='96' width='84' height='60' rx='8' fill='%23F59E0B'/%3E%3Cpath d='M84 156 A12 18 0 0 1 108 156 Z' fill='%23064E3B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #064E3B;
      --primary-dark: #022C22;
      --primary-light: #D1FAE5;
      --amber: #D97706;
      --amber-light: #FEF3C7;
      --amber-gold: #F59E0B;
      --surface: #FFFFFF;
      --bg: #F8F9FA;
      --border: #E5E7EB;
      --text: #111827;
      --text-muted: #6B7280;
      --danger: #EF4444;
      --success: #10B981;
      --radius: 16px;
      --shadow: 0 4px 18px rgba(6, 78, 59, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 100px;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      color: white;
      padding: 1.25rem 1rem 1.6rem;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 8px 24px rgba(2, 44, 34, 0.3);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    .brand-icon-box {
      width: 32px;
      height: 32px;
      background: var(--amber-gold);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-dark);
    }
    .badge-user {
      background: rgba(245, 158, 11, 0.25);
      border: 1px solid var(--amber-gold);
      color: #FDE68A;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
    }
    .header-sub {
      font-size: 0.78rem;
      color: #A7F3D0;
      margin-top: 0.35rem;
    }
    
    /* Backup Bar */
    .backup-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      border-radius: 12px;
      padding: 0.55rem 0.85rem;
      margin: 0.85rem 0 0.2rem;
      font-size: 0.75rem;
      color: #065F46;
      font-weight: 600;
    }
    .backup-bar-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .backup-btns {
      display: flex;
      gap: 0.4rem;
    }
    .btn-mini-backup {
      background: #FFFFFF;
      border: 1px solid #10B981;
      color: #065F46;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .rekap-card {
      background: white;
      border-radius: var(--radius);
      margin: 0.85rem 0;
      padding: 1.15rem;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      border: 1px solid var(--border);
    }
    .rekap-item {
      padding: 0.75rem 0.85rem;
      border-radius: 12px;
      border-left: 4px solid var(--amber-gold);
      background: #FFFBEB;
    }
    .rekap-item.hijau {
      border-left-color: var(--success);
      background: #ECFDF5;
    }
    .rekap-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .rekap-val {
      font-size: 1.25rem;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      margin-top: 0.25rem;
      color: var(--text);
    }
    .container {
      padding: 0 1rem;
      max-width: 600px;
      margin: 0 auto;
    }
    .btn-wa-broadcast {
      width: 100%;
      background: linear-gradient(135deg, #10B981, #059669);
      color: white;
      border: none;
      padding: 0.95rem;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
      margin-bottom: 1.2rem;
      transition: all 0.2s;
    }
    .btn-wa-broadcast:active { transform: scale(0.97); }

    /* PWA Install Banner */
    .pwa-install-card {
      background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%);
      border: 1.5px solid var(--amber-gold);
      border-radius: var(--radius);
      padding: 0.95rem 1rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .pwa-install-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .pwa-install-icon {
      width: 38px;
      height: 38px;
      background: var(--amber-gold);
      color: var(--primary-dark);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .pwa-install-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: #78350F;
    }
    .pwa-install-desc {
      font-size: 0.72rem;
      color: #92400E;
      margin-top: 0.15rem;
    }
    .btn-install-app {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #FFFFFF;
      border: none;
      padding: 0.55rem 0.95rem;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 3px 8px rgba(6, 78, 59, 0.25);
      transition: all 0.2s;
    }
    .btn-install-app:active { transform: scale(0.96); }

    .sec-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    /* Quick Tap Baitina */
    .quick-section {
      background: white;
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1.2rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
    }
    .quick-btn {
      background: #FAFAFA;
      border: 1.5px solid #E5E7EB;
      border-radius: 12px;
      padding: 0.75rem 0.7rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .quick-btn:active {
      transform: scale(0.96);
      border-color: var(--amber-gold);
      background: #FFFBEB;
    }
    .quick-btn.baitina {
      background: #FFFDF7;
      border-color: #FDE68A;
    }
    .quick-name-wrap {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .quick-icon-box {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: #FEF3C7;
      color: var(--amber);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .quick-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: #1F2937;
      line-height: 1.2;
    }
    .quick-price-wrap {
      margin-top: 0.4rem;
      padding-left: 30px;
    }
    .quick-price {
      font-size: 0.76rem;
      color: var(--amber);
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
    }
    .quick-tier-hint {
      font-size: 0.65rem;
      color: var(--text-muted);
      display: block;
      margin-top: 1px;
    }

    /* Tier Price Pill / Box in Modal */
    .tier-box {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      border-radius: 10px;
      padding: 0.6rem 0.75rem;
      margin-top: 0.35rem;
      margin-bottom: 0.85rem;
      font-size: 0.73rem;
      color: #78350F;
      line-height: 1.5;
    }
    .tier-box-title {
      font-weight: 800;
      color: var(--amber);
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .tier-active-badge {
      display: inline-block;
      background: var(--primary);
      color: white;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      margin-left: 0.3rem;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.3rem;
      background: #E5E7EB;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 0.9rem;
    }
    .tab {
      flex: 1;
      border: none;
      padding: 0.6rem 0.4rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.76rem;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
      text-align: center;
    }
    .tab.active {
      background: white;
      color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    /* Transaction List */
    .trans-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .trans-card {
      background: white;
      border-radius: 14px;
      padding: 1rem;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .trans-card.pending {
      border-left: 4px solid var(--amber-gold);
    }
    .trans-card.settled {
      border-left: 4px solid var(--success);
      background: #FCFDFD;
    }
    .trans-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .trans-title {
      font-weight: 800;
      font-size: 0.96rem;
      color: var(--text);
    }
    .trans-price {
      font-size: 1.15rem;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      color: var(--primary);
      white-space: nowrap;
    }
    .info-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.75rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      align-items: center;
      background: #F9FAFB;
      padding: 0.45rem 0.6rem;
      border-radius: 8px;
    }
    .info-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-weight: 600;
    }
    .badge-metode {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
    }
    .badge-cash {
      background: #D1FAE5;
      color: #065F46;
      border: 1px solid #A7F3D0;
    }
    .badge-tf {
      background: #DBEAFE;
      color: #1E40AF;
      border: 1px solid #BFDBFE;
    }
    .badge-utang {
      background: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FECACA;
    }
    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
    }
    .badge-status.pending {
      background: #FEF3C7;
      color: #92400E;
    }
    .badge-status.settled {
      background: #D1FAE5;
      color: #065F46;
    }
    .trans-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed var(--border);
      padding-top: 0.55rem;
      margin-top: 0.25rem;
    }
    .btn-toggle-status {
      background: #EEF2F6;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .btn-del {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0.35rem 0.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    /* Bottom Floating Action */
    .fab-btn {
      position: fixed;
      bottom: 1.2rem;
      left: 1rem;
      right: 1rem;
      max-width: 600px;
      margin: 0 auto;
      background: linear-gradient(135deg, var(--amber-gold) 0%, var(--amber) 100%);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 1rem;
      font-weight: 800;
      font-size: 0.98rem;
      box-shadow: 0 10px 24px rgba(217, 119, 6, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      z-index: 100;
    }

    /* Modal Form */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      backdrop-filter: blur(3px);
      align-items: flex-end;
      justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-sheet {
      background: white;
      width: 100%;
      max-width: 550px;
      border-radius: 24px 24px 0 0;
      padding: 1.4rem;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .form-group {
      margin-bottom: 0.95rem;
    }
    .form-group label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 0.75rem 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.92rem;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--amber-gold);
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      padding: 0.95rem;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn-cancel {
      width: 100%;
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 0.65rem;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 0.3rem;
    }
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Header Banner -->
  <header>
    <div class="header-top">
      <div class="brand-title">
        <div class="brand-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C10.5 4 9.5 5.5 9.5 7C9.5 8.2 10.5 9 12 9C13.5 9 14.5 8.2 14.5 7C14.5 5.5 13.5 4 12 2ZM5 10H19V13H5V10ZM6 14H18V21H14V17C14 15.9 13.1 15 12 15C10.9 15 10 15.9 10 17V21H6V14ZM3 21H21V23H3V21Z"/>
          </svg>
        </div>
        <span>KOPONTREN AL ITTIHAD</span>
      </div>
      <div class="badge-user">Catatan Gus Lim</div>
    </div>
    <div class="header-sub">Buku Catatan Digital — Riwayat Disimpen Aman & Awet</div>
  </header>

  <!-- Container -->
  <div class="container">

    <!-- Bar Status & Backup Data -->
    <div class="backup-bar">
      <div class="backup-bar-label">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17 3H5C3.89 3 3 3.9 3 5V19C3 20.1 3.89 21 5 21H19C20.1 21 21 20.1 21 19V7L17 3ZM12 19C10.34 19 9 17.66 9 16C9 14.34 10.34 13 12 13C13.66 13 15 14.34 15 16C15 17.66 13.66 19 12 19ZM15 9H5V5H15V9Z"/>
        </svg>
        <span>Riwayat Kesimpen Permanen</span>
      </div>
      <div class="backup-btns">
        <button class="btn-mini-backup" onclick="exportDataExcel()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 9H15V3H9V9H5L12 16L19 9ZM5 18V20H19V18H5Z"/>
          </svg>
          <span>Unduh Excel/CSV</span>
        </button>
        <button class="btn-mini-backup" onclick="backupJSON()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 6H12L10 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V8C22 6.9 21.1 6 20 6Z"/>
          </svg>
          <span>Backup</span>
        </button>
      </div>
    </div>


    <!-- Rekap Ringkas -->
    <div class="rekap-card">
      <div class="rekap-item">
        <div class="rekap-label">Belum Lapor Pak Kholiq</div>
        <div class="rekap-val" id="rekapBelumLapor">Rp 0</div>
        <div style="font-size: 0.7rem; color: var(--amber); font-weight: 700; margin-top: 2px;" id="countBelumLapor">0 Trx</div>
      </div>
      <div class="rekap-item hijau">
        <div class="rekap-label">Sudah Disetor (Arsip Aman)</div>
        <div class="rekap-val" id="rekapSudahLapor">Rp 0</div>
        <div style="font-size: 0.7rem; color: var(--success); font-weight: 700; margin-top: 2px;" id="countSudahLapor">0 Trx</div>
      </div>
    </div>

    <!-- Tombol 1-Klik Kirim Rekap ke Pak Kholiq -->
    <button class="btn-wa-broadcast" onclick="kirimWhatsAppPakKholiq()">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
      </svg>
      <span>Kirim Laporan WA ke Pak Kholiq</span>
    </button>

    <!-- Quick Tap Produk Baitina (Sesuai Daftar Harga Resmi) -->

        return d ? JSON.parse(d) : [];
      } catch (e) {
        console.error('Error membaca storage:', e);
        return [];
      }
    }

    function saveData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        alert('Memori penyimpanan browser penuh atau tidak didukung!');
      }
      render();
    }

    function setDefaultDateTime() {
      const now = new Date();
      const yr = now.getFullYear();
      const mo = String(now.getMonth() + 1).padStart(2, '0');
      const da = String(now.getDate()).padStart(2, '0');
      const hr = String(now.getHours()).padStart(2, '0');
      const mi = String(now.getMinutes()).padStart(2, '0');

      document.getElementById('inpTanggal').value = `${yr}-${mo}-${da}`;
      document.getElementById('inpJam').value = `${hr}:${mi}`;
    }

    function bukaModalProduk(productKey) {
      currentProductKey = productKey;
      const prod = MASTER_PRODUK[productKey];
      setDefaultDateTime();

      document.getElementById('modalHeading').innerText = `Catat: ${prod.nama}`;
      document.getElementById('inpBarang').value = prod.nama;
      document.getElementById('inpQty').value = 1;
      document.getElementById('inpNamaPembeli').value = '';
      document.getElementById('inpKategoriPembeli').value = 'Santri Putra';
      document.getElementById('inpMetode').value = 'CASH';
      document.getElementById('inpCatatan').value = '';

      // Tampilkan varian rasa jika ada
      const flavorGroup = document.getElementById('groupVarianRasa');
      if (prod.hasFlavor) {
        flavorGroup.style.display = 'block';
      } else {
        flavorGroup.style.display = 'none';
      }

      // Tampilkan skema tier harga
      const tierBox = document.getElementById('tierPriceInfo');
      const tierList = document.getElementById('tierPriceList');
      if (prod.tiers && prod.tiers.length > 1) {
        tierBox.style.display = 'block';
        tierList.innerHTML = prod.tiers.map(t => `&bull; ${t.label}: <b>Rp ${t.harga.toLocaleString('id-ID')}/${prod.satuan.split(' ')[0]}</b>`).join('<br>');
      } else {
        tierBox.style.display = 'none';
      }

      hitungHargaBertingkat();
      document.getElementById('inputModal').classList.add('show');
    }

    function bukaModalManual() {
      currentProductKey = null;
      setDefaultDateTime();
      document.getElementById('modalHeading').innerText = 'Catat Pembelian Baru';
      document.getElementById('inpBarang').value = '';
      document.getElementById('inpQty').value = 1;
      document.getElementById('inpHarga').value = '';
      document.getElementById('inpNamaPembeli').value = '';
      document.getElementById('inpKategoriPembeli').value = 'Santri Putra';
      document.getElementById('inpMetode').value = 'CASH';
      document.getElementById('inpCatatan').value = '';
      document.getElementById('groupVarianRasa').style.display = 'none';
      document.getElementById('tierPriceInfo').style.display = 'none';
      document.getElementById('inputModal').classList.add('show');
    }

    // Fungsi Otomatis Hitung Harga Sesuai Tier Qty
    function hitungHargaBertingkat() {
      const qty = Math.max(1, Number(document.getElementById('inpQty').value) || 1);
      
      if (currentProductKey && MASTER_PRODUK[currentProductKey]) {
        const prod = MASTER_PRODUK[currentProductKey];

        // Produk dengan harga manual: tidak auto-hitung
        if (prod.manualPrice) {
          document.getElementById('inpHarga').value = '';
          return;
        }

        let unitPrice = prod.tiers[0].harga;
        let activeLabel = prod.tiers[0].label;

        for (const t of prod.tiers) {
          if (qty >= t.min && qty <= t.max) {
            unitPrice = t.harga;
            activeLabel = `@Rp ${t.harga.toLocaleString('id-ID')}`;
            break;
          }
        }

        const total = qty * unitPrice;
        document.getElementById('inpHarga').value = total;

        const badgeTier = document.getElementById('badgeTierAktif');
        if (badgeTier) {
          badgeTier.innerText = `${activeLabel} (Hemat: Otomatis)`;
        }
      }
    }

    function tutupModal() {
      document.getElementById('inputModal').classList.remove('show');
    }

    function formatTanggalIndonesia(dateStr, timeStr) {
      if (!dateStr) return timeStr || '';
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        const bln = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        const bIndex = parseInt(parts[1], 10) - 1;
        return `${parseInt(parts[2], 10)} ${bln[bIndex]} ${parts[0]}, ${timeStr || ''} WIB`;
      }
      return `${dateStr} ${timeStr || ''}`;
    }

    function simpanTransaksi() {
      const tanggal = document.getElementById('inpTanggal').value;
      const jam = document.getElementById('inpJam').value;
      let barang = document.getElementById('inpBarang').value.trim();
      const qty = document.getElementById('inpQty').value || 1;
      const harga = Number(document.getElementById('inpHarga').value);
      const namaPembeli = document.getElementById('inpNamaPembeli').value.trim();
      const kategoriPembeli = document.getElementById('inpKategoriPembeli').value;
      const metode = document.getElementById('inpMetode').value;
      const catatan = document.getElementById('inpCatatan').value.trim();

      if (!barang) {
        alert('Nama barang mohon diisi');
        return;
      }
      if (!harga || harga <= 0) {
        alert('Harga mohon diisi dengan benar');
        return;
      }
      if (!qty || qty <= 0 || isNaN(qty)) {
        alert('Qty harus lebih dari 0');
        return;
      }

      // Tambahkan info rasa jika nasi jagung
      if (currentProductKey === 'nasijagung') {
        const rasa = document.getElementById('inpVarianRasa').value;
        barang = `${barang} [${rasa}]`;
      }

      const pembeliLengkap = namaPembeli ? `${namaPembeli} (${kategoriPembeli})` : kategoriPembeli;
      const formatWaktu = formatTanggalIndonesia(tanggal, jam);

      const newItem = {
        id: 'TRX-' + Date.now(),
        tanggal: tanggal,
        jam: jam,
        waktuFormat: formatWaktu,
        barang: `${barang} (x${qty})`,
        namaPembeli: namaPembeli || kategoriPembeli,
        kategoriPembeli: kategoriPembeli,
        pembeli: pembeliLengkap,
        harga: harga,
        metode: metode,
        catatan: catatan,
        status: 'pending'
      };

      const data = getStoredData();
      data.unshift(newItem);
      saveData(data);
      tutupModal();
    }

    function toggleStatus(id) {
      const data = getStoredData();
      const item = data.find(x => x.id === id);
      if (item) {
        item.status = (item.status === 'pending') ? 'settled' : 'pending';
        item.waktuSetor = (item.status === 'settled') ? new Date().toLocaleString('id-ID') : null;
        saveData(data);
      }
    }

    function hapusItem(id) {
      if (!confirm('Yakin ingin menghapus catatan transaksi ini dari riwayat?')) return;
      let data = getStoredData();
      data = data.filter(x => x.id !== id);
      saveData(data);
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabPending').classList.toggle('active', tab === 'pending');
      document.getElementById('tabSettled').classList.toggle('active', tab === 'settled');
      document.getElementById('tabAll').classList.toggle('active', tab === 'all');
      render();
    }

    function render() {
      const data = getStoredData();

      let pendingTotal = 0;
      let pendingCash = 0;
      let pendingTransfer = 0;
      let pendingCount = 0;
      let settledTotal = 0;
      let settledCount = 0;

      data.forEach(item => {
        if (item.status === 'pending') {
          pendingTotal += item.harga;
          pendingCount++;
          if (item.metode === 'CASH') pendingCash += item.harga;
          if (item.metode === 'TRANSFER') pendingTransfer += item.harga;
        } else {
          settledTotal += item.harga;
          settledCount++;
        }
      });

      document.getElementById('rekapBelumLapor').innerText = 'Rp ' + pendingTotal.toLocaleString('id-ID');
      document.getElementById('countBelumLapor').innerHTML = `${pendingCount} Trx <span style="font-weight:400; color:var(--text-muted);">(Cash: Rp ${pendingCash.toLocaleString('id-ID')} | TF: Rp ${pendingTransfer.toLocaleString('id-ID')})</span>`;
      document.getElementById('rekapSudahLapor').innerText = 'Rp ' + settledTotal.toLocaleString('id-ID');
      document.getElementById('countSudahLapor').innerText = `${settledCount} Trx (Arsip)`;

      document.getElementById('tabPendingCount').innerText = pendingCount;
      document.getElementById('tabSettledCount').innerText = settledCount;
      document.getElementById('tabAllCount').innerText = data.length;

      let filtered = data;
      if (currentTab === 'pending') {
        filtered = data.filter(x => x.status === 'pending');
      } else if (currentTab === 'settled') {
        filtered = data.filter(x => x.status === 'settled');
      }

      const container = document.getElementById('transList');

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>Ora ana catatan transaksi ning tab iki.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isCash = item.metode === 'CASH';
        const isTF = item.metode === 'TRANSFER';
        const badgeMetodeClass = isCash ? 'badge-cash' : (isTF ? 'badge-tf' : 'badge-utang');
        const badgeMetodeIcon = isCash ? SVG_ICONS.money : (isTF ? SVG_ICONS.phone : SVG_ICONS.note);
        const badgeMetodeText = isCash ? 'CASH' : (isTF ? 'TRANSFER' : 'UTANG');
        const waktuTampil = item.waktuFormat || item.waktu || '-';

        return `
          <div class="trans-card ${item.status}">
            <div class="trans-header">
              <div>
                <div class="trans-title">${item.barang}</div>
              </div>
              <div class="trans-price">Rp ${item.harga.toLocaleString('id-ID')}</div>
            </div>

            <!-- Detail Waktu, Pembeli, Metode -->
            <div class="info-row">
              <span class="info-tag">${SVG_ICONS.clock} <b>${waktuTampil}</b></span>
              <span class="info-tag">${SVG_ICONS.user} <b>${item.pembeli}</b></span>
              <span class="badge-metode ${badgeMetodeClass}">
                ${badgeMetodeIcon}
                <span>${badgeMetodeText}</span>
              </span>
              <span class="badge-status ${item.status === 'pending' ? 'pending' : 'settled'}">
                ${item.status === 'pending' ? SVG_ICONS.hour : SVG_ICONS.check}
                <span>${item.status === 'pending' ? 'Belum Lapor' : 'Sudah Disetor'}</span>
              </span>
              ${item.catatan ? `<span class="info-tag"><i>"${item.catatan}"</i></span>` : ''}
            </div>

            <div class="trans-actions">
              <button class="btn-toggle-status" onclick="toggleStatus('${item.id}')">
                ${item.status === 'pending' ? SVG_ICONS.check + ' Tandai Sudah Disetor ke Pak Kholiq' : SVG_ICONS.undo + ' Kembalikan ke Belum Lapor'}
              </button>
              <button class="btn-del" onclick="hapusItem('${item.id}')">
                ${SVG_ICONS.trash} Hapus
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function kirimWhatsAppPakKholiq() {
      const data = getStoredData().filter(x => x.status === 'pending');
      if (data.length === 0) {
        alert('Alhamdulillah! Kabeh transaksi wis dilaporke / disetor maring Pak Kholiq.');
        return;
      }

      let totalCash = 0;
      let totalTransfer = 0;
      let totalSemua = 0;
      let textList = '';

      data.forEach((item, idx) => {
        totalSemua += item.harga;
        if (item.metode === 'CASH') totalCash += item.harga;
        if (item.metode === 'TRANSFER') totalTransfer += item.harga;

        const waktuTampil = item.waktuFormat || item.waktu || '';
        const metodeLabel = item.metode === 'CASH' ? 'CASH' : (item.metode === 'TRANSFER' ? 'TRANSFER' : 'UTANG');
        textList += `${idx + 1}. *[${waktuTampil}]* ${item.barang}\n   - Pembeli: ${item.pembeli}\n   - Nominal: Rp ${item.harga.toLocaleString('id-ID')} (*${metodeLabel}*)${item.catatan ? '\n   - Catatan: ' + item.catatan : ''}\n\n`;
      });

      const pesan = `*Assalamu'alaikum Pak Kholiq,*\nNiki rekap titipan penjualan Kopontren sakjabane jam jaga (Catatan Gus Lim):\n\n${textList}----------------------------------\n*Rincian Pembayaran:*\nTotal Uang Tunai (CASH): *Rp ${totalCash.toLocaleString('id-ID')}*\nTotal Masuk Rekening (TRANSFER): *Rp ${totalTransfer.toLocaleString('id-ID')}*\n*TOTAL SEMUA: Rp ${totalSemua.toLocaleString('id-ID')}*\n----------------------------------\nUang fisik (CASH) kulo cekel/setorake. Matur suwun.`;

      const encoded = encodeURI(pesan);
      const url = `https://api.whatsapp.com/send?text=${encoded}`;
      
      if (confirm(`Rangkuman ${data.length} transaksi:\n- CASH: Rp ${totalCash.toLocaleString('id-ID')}\n- TRANSFER: Rp ${totalTransfer.toLocaleString('id-ID')}\n- TOTAL: Rp ${totalSemua.toLocaleString('id-ID')}\n\nKirim menyang WhatsApp Pak Kholiq saiki?`)) {
        window.open(url, '_blank');
      }
    }

    function exportDataExcel() {
      const data = getStoredData();
      if (data.length === 0) {
        alert('Ora ana data transaksi sing bisa diundhuh.');
        return;
      }

      let csv = "ID,Tanggal & Waktu,Nama Barang,Pembeli,Harga (Rp),Metode,Status,Catatan\n";
      data.forEach(item => {
        const waktu = `"${item.waktuFormat || item.waktu || ''}"`;
        const barang = `"${item.barang || ''}"`;
        const pembeli = `"${item.pembeli || ''}"`;
        const harga = item.harga || 0;
        const metode = `"${item.metode || ''}"`;
        const status = item.status === 'pending' ? 'Belum Lapor' : 'Sudah Disetor';
        const catatan = `"${item.catatan || ''}"`;

        csv += `${item.id},${waktu},${barang},${pembeli},${harga},${metode},${status},${catatan}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `Riwayat_Kopontren_GusLim_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function backupJSON() {
      const data = getStoredData();
      const str = JSON.stringify(data, null, 2);
      const blob = new Blob([str], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `Backup_Catatan_Kopontren_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    render();

    // Bersihkan data lama dari versi sebelumnya (versi lama isi sample otomatis)
    const LAST_VERSION = '2.0';
    try {
      const savedVer = localStorage.getItem('kopontren_version');
      if (!savedVer || savedVer < LAST_VERSION) {
        // Hapus localStorage lama yang mungkin masih ada data sample
        localStorage.removeItem(STORAGE_KEY);
        localStorage.setItem('kopontren_version', LAST_VERSION);
        console.log('Data lama dibersihkan, version:', LAST_VERSION);
      }
    } catch(e) {}


    // Registrasi Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) {
            if (reg.scope.includes('kopontren')) {
              await reg.unregister();
              console.log('Old SW unregistered');
            }
          }
        } catch(e) {}
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW error:', err));
      });
    }
  </script>
