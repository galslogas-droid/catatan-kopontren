<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A6B4E"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="wL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#86EFAC" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="wR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#86EFAC" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#000" flood-opacity="0.28"/></filter>
    <filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- Honeycomb pattern -->
  <g fill="#F59E0B" opacity="0.07">
    <polygon points="22,16 33,10 44,16 44,28 33,34 22,28"/>
    <polygon points="44,28 55,22 66,28 66,40 55,46 44,40"/>
    <polygon points="126,16 137,10 148,16 148,28 137,34 126,28"/>
    <polygon points="148,28 159,22 170,28 170,40 159,46 148,40"/>
    <polygon points="22,130 33,124 44,130 44,142 33,148 22,142"/>
    <polygon points="148,130 159,124 170,130 170,142 159,148 148,142"/>
  </g>

  <!-- Back wings -->
  <ellipse cx="64" cy="87" rx="27" ry="10" fill="url(#wL)" opacity="0.5" transform="rotate(-40,64,87)"/>
  <ellipse cx="128" cy="87" rx="27" ry="10" fill="url(#wR)" opacity="0.5" transform="rotate(40,128,87)"/>

  <!-- Front wings -->
  <ellipse cx="55" cy="76" rx="32" ry="14" fill="url(#wL)" opacity="0.88" transform="rotate(-33,55,76)"/>
  <ellipse cx="137" cy="76" rx="32" ry="14" fill="url(#wR)" opacity="0.88" transform="rotate(33,137,76)"/>

  <!-- Abdomen -->
  <ellipse cx="96" cy="112" rx="25" ry="31" fill="#F59E0B" filter="url(#sh)"/>
  <rect x="72" y="102" width="48" height="8" rx="4" fill="#1C1917" opacity="0.55"/>
  <rect x="72" y="115" width="48" height="8" rx="4" fill="#1C1917" opacity="0.55"/>
  <rect x="74" y="127" width="44" height="7" rx="3.5" fill="#1C1917" opacity="0.45"/>
  <polygon points="96,143 90,153 102,153" fill="#D97706"/>

  <!-- Thorax -->
  <ellipse cx="96" cy="83" rx="19" ry="14" fill="#F59E0B" filter="url(#sh)"/>

  <!-- Head -->
  <ellipse cx="96" cy="59" rx="17" ry="16" fill="#F59E0B" filter="url(#sh)"/>

  <!-- Eyes -->
  <ellipse cx="88" cy="56" rx="4.5" ry="5" fill="#1C1917"/>
  <circle cx="89" cy="54" r="2" fill="white" opacity="0.9"/>
  <circle cx="88" cy="57" r="2.2" fill="#0A0A0A"/>
  <circle cx="89" cy="54" r="1.1" fill="white"/>

  <ellipse cx="104" cy="56" rx="4.5" ry="5" fill="#1C1917"/>
  <circle cx="105" cy="54" r="2" fill="white" opacity="0.9"/>
  <circle cx="104" cy="57" r="2.2" fill="#0A0A0A"/>
  <circle cx="105" cy="54" r="1.1" fill="white"/>

  <!-- Antennae -->
  <path d="M90,45 Q81,34 74,25" stroke="#1C1917" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <circle cx="74" cy="25" r="3.8" fill="#F59E0B" stroke="#1C1917" stroke-width="1.3"/>
  <path d="M102,45 Q111,34 118,25" stroke="#1C1917" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <circle cx="118" cy="25" r="3.8" fill="#F59E0B" stroke="#1C1917" stroke-width="1.3"/>

  <!-- "Madu ruQyah" text -->
  <text x="96" y="168"
        font-family="'Arial Rounded MT Bold',Arial,sans-serif"
        font-size="13" font-weight="700"
        fill="#FBBF24" text-anchor="middle" letter-spacing="0.5">Madu ruQyah</text>

  <!-- "Baitina" main text -->
  <text x="96" y="163"
        font-family="'Arial Rounded MT Bold',Arial,sans-serif"
        font-size="28" font-weight="900"
        fill="#92400E" text-anchor="middle" opacity="0.5">Baitina</text>
  <text x="96" y="162"
        font-family="'Arial Rounded MT Bold',Arial,sans-serif"
        font-size="28" font-weight="900"
        fill="white" text-anchor="middle">Baitina</text>
  <rect x="54" y="170" width="84" height="1.5" rx="0.75" fill="#F59E0B" opacity="0.75"/>
</svg>
