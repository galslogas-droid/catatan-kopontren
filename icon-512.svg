<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient - deep emerald -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A6B4E"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <!-- Amber/honey gold gradient -->
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Wing gradient - translucent greenish white -->
    <linearGradient id="wingL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#86EFAC" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="wingR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#86EFAC" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Drop shadow -->
    <filter id="drop" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <!-- Text shadow -->
    <filter id="tshadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ====== BACKGROUND ====== -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle honeycomb bg pattern -->
  <g fill="#F59E0B" opacity="0.065">
    <!-- Hex shapes positioned at corners -->
    <polygon points="60,44 88,28 116,44 116,76 88,92 60,76"/>
    <polygon points="116,76 144,60 172,76 172,108 144,124 116,108"/>
    <polygon points="340,44 368,28 396,44 396,76 368,92 340,76"/>
    <polygon points="396,76 424,60 452,76 452,108 424,124 396,108"/>
    <polygon points="60,350 88,334 116,350 116,382 88,398 60,382"/>
    <polygon points="396,350 424,334 452,350 452,382 424,398 396,382"/>
    <polygon points="116,382 144,366 172,382 172,414 144,430 116,414"/>
    <polygon points="340,350 368,334 396,350 396,382 368,398 340,382"/>
  </g>

  <!-- Center warm glow -->
  <radialGradient id="cglow" cx="50%" cy="44%" r="42%">
    <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="112" fill="url(#cglow)"/>

  <!-- ====== BEE ====== -->
  <!-- positioned centered, upper portion -->

  <!-- === WINGS === -->
  <!-- Back wings (behind body) -->
  <ellipse cx="172" cy="232" rx="72" ry="27" fill="url(#wingL)" opacity="0.5" transform="rotate(-40,172,232)"/>
  <ellipse cx="340" cy="232" rx="72" ry="27" fill="url(#wingR)" opacity="0.5" transform="rotate(40,340,232)"/>

  <!-- Front wings -->
  <ellipse cx="148" cy="202" rx="86" ry="37" fill="url(#wingL)" opacity="0.88" transform="rotate(-33,148,202)"/>
  <!-- Wing veins left -->
  <line x1="148" y1="202" x2="96" y2="160" stroke="#BBF7D0" stroke-width="1.5" opacity="0.45"/>
  <line x1="148" y1="202" x2="82" y2="202" stroke="#BBF7D0" stroke-width="1" opacity="0.3"/>

  <ellipse cx="364" cy="202" rx="86" ry="37" fill="url(#wingR)" opacity="0.88" transform="rotate(33,364,202)"/>
  <!-- Wing veins right -->
  <line x1="364" y1="202" x2="416" y2="160" stroke="#BBF7D0" stroke-width="1.5" opacity="0.45"/>
  <line x1="364" y1="202" x2="430" y2="202" stroke="#BBF7D0" stroke-width="1" opacity="0.3"/>

  <!-- === BODY (ABDOMEN) === -->
  <ellipse cx="256" cy="298" rx="66" ry="84" fill="#F59E0B" filter="url(#drop)"/>
  <!-- Body highlight -->
  <ellipse cx="242" cy="272" rx="22" ry="28" fill="#FDE68A" opacity="0.4"/>
  <!-- Stripes -->
  <rect x="192" y="272" width="128" height="22" rx="11" fill="#1C1917" opacity="0.55"/>
  <rect x="192" y="304" width="128" height="22" rx="11" fill="#1C1917" opacity="0.55"/>
  <rect x="196" y="334" width="120" height="19" rx="9.5" fill="#1C1917" opacity="0.45"/>
  <!-- Stinger tip -->
  <polygon points="256,382 242,405 270,405" fill="#D97706"/>

  <!-- === THORAX === -->
  <ellipse cx="256" cy="222" rx="50" ry="38" fill="#F59E0B" filter="url(#drop)"/>
  <ellipse cx="244" cy="212" rx="24" ry="16" fill="#FDE68A" opacity="0.35"/>

  <!-- === HEAD === -->
  <ellipse cx="256" cy="158" rx="46" ry="42" fill="#F59E0B" filter="url(#drop)"/>
  <ellipse cx="244" cy="147" rx="18" ry="14" fill="#FDE68A" opacity="0.35"/>

  <!-- EYES -->
  <!-- Left eye -->
  <ellipse cx="234" cy="151" rx="12" ry="14" fill="#1C1917"/>
  <circle cx="237" cy="146" r="5.5" fill="white" opacity="0.92"/>
  <circle cx="235" cy="152" r="6" fill="#0A0A0A"/>
  <circle cx="237" cy="147" r="2.8" fill="white"/>

  <!-- Right eye -->
  <ellipse cx="278" cy="151" rx="12" ry="14" fill="#1C1917"/>
  <circle cx="281" cy="146" r="5.5" fill="white" opacity="0.92"/>
  <circle cx="279" cy="152" r="6" fill="#0A0A0A"/>
  <circle cx="281" cy="147" r="2.8" fill="white"/>

  <!-- ANTENNAE -->
  <path d="M241,120 Q216,90 198,66" stroke="#1C1917" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="198" cy="66" r="10" fill="#F59E0B" stroke="#1C1917" stroke-width="3.5"/>
  <circle cx="198" cy="66" r="5" fill="#FDE68A"/>

  <path d="M271,120 Q296,90 314,66" stroke="#1C1917" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="314" cy="66" r="10" fill="#F59E0B" stroke="#1C1917" stroke-width="3.5"/>
  <circle cx="314" cy="66" r="5" fill="#FDE68A"/>

  <!-- ====== BRAND TEXT ====== -->
  <!-- "Madu ruQyah" small tagline -->
  <text x="256" y="446"
        font-family="'Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif"
        font-size="38" font-weight="700"
        fill="#FBBF24" text-anchor="middle"
        letter-spacing="1.5"
        filter="url(#tshadow)">Madu ruQyah</text>

  <!-- "Baitina" main brand text - big, amber gradient -->
  <!-- Shadow layer -->
  <text x="258" y="497"
        font-family="'Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif"
        font-size="90" font-weight="900"
        fill="#92400E" text-anchor="middle"
        letter-spacing="2" opacity="0.45">Baitina</text>

  <!-- Glow layer -->
  <text x="256" y="495"
        font-family="'Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif"
        font-size="90" font-weight="900"
        fill="#F59E0B" text-anchor="middle"
        letter-spacing="2" opacity="0.3"
        filter="url(#glow)">Baitina</text>

  <!-- Main text -->
  <text x="256" y="495"
        font-family="'Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif"
        font-size="90" font-weight="900"
        fill="white" text-anchor="middle"
        letter-spacing="2">Baitina</text>

  <!-- Gold underline -->
  <rect x="146" y="503" width="220" height="4" rx="2" fill="#F59E0B" opacity="0.8"/>
  <!-- Decorative dots -->
  <circle cx="133" cy="494" r="5.5" fill="#F59E0B" opacity="0.55"/>
  <circle cx="379" cy="494" r="5.5" fill="#F59E0B" opacity="0.55"/>
</svg>
